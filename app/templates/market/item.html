{% extends "base.html" %}
{% block title %}{{ item.name }} — Dota Market{% endblock %}
{% block content %}
<h1>{{ item.name }}</h1>
<p>{{ item.description }}</p>
<p>Цена: {{ item.price }} | В наличии: {{ item.stock }}</p>
<form action="{{ url_for('item_add', item_id=item.id) }}" method="post">
  <input type="number" name="quantity" value="1" min="1" max="{{ item.stock }}" required>
  <button type="submit" {% if item.stock == 0 %}disabled{% endif %}>В корзину</button>
</form>
<p><a href="{{ url_for('items_page') }}">Назад к маркету</a></p>
{% endblock %}
