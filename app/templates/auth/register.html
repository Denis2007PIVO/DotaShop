{% extends "base.html" %}
{% block title %}Регистрация — Dota Market{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" action="{{ url_for('register') }}">
  <label>Имя пользователя <input name="username" minlength="3" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Пароль <input name="password" type="password" minlength="8" required></label>
  <button type="submit">Создать аккаунт</button>
</form>
<p>Уже есть аккаунт? <a href="{{ url_for('login_page') }}">Войти</a></p>
{% endblock %}
